run: uvicorn app:app --reload
seed: python seed.py
test: pytest -q
test_count: 12
customer_site: python3 -m http.server 5500 --directory customer-site
base_url: http://localhost:8000
endpoints:
  - POST /admin/widgets
  - GET /widgets/{widget_id}/config
  - GET /widget.v1.js
  - OPTIONS /submissions
  - POST /submissions
  - GET /dashboard/stats
